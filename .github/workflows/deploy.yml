name: Deploy Attack-Defense

on:
  push:
    branches:
      - main
      - release/2.0.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.VPS_KEY }}

      - name: Build Docker image
        run: |
          docker build -t attackdefense/hits-attack-defense-platform:latest .

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image to registry
        run: |
          docker tag attackdefense/hits-attack-defense-platform:latest docker.io/${{ secrets.DOCKER_USERNAME }}/hits-attack-defense-platform:latest
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/hits-attack-defense-platform:latest

      - name: Add VPS to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          ssh -t $VPS_USER@$VPS_HOST << EOF
            set -e

            BRANCH_NAME="${{ github.ref_name }}"
            REPO_URL="https://x-access-token:$REPO_TOKEN@github.com/${{ github.repository }}.git"
            PUBLIC_REPO_URL="https://github.com/${{ github.repository }}.git"
            trap 'git -C ~/attack-defence-platform remote set-url origin "\$PUBLIC_REPO_URL" 2>/dev/null || true' EXIT

            if [ ! -d ~/attack-defence-platform/.git ]; then
              git clone --branch "\$BRANCH_NAME" "\$REPO_URL" ~/attack-defence-platform
            fi

            cd ~/attack-defence-platform/
            git remote set-url origin "\$REPO_URL"
            git fetch --all --prune
            git checkout -B "\$BRANCH_NAME" "origin/\$BRANCH_NAME"
            git reset --hard "origin/\$BRANCH_NAME"

            printf "POSTGRES_USER=%s\n" "$POSTGRES_USER" > .env
            printf "POSTGRES_PASSWORD=%s\n" "$POSTGRES_PASSWORD" >> .env
            printf "REDIS_PASSWORD=%s\n" "$REDIS_PASSWORD" >> .env
            printf "DOCKER_USERNAME=%s\n" "$DOCKER_USERNAME" >> .env
            printf "REPO_TOKEN=%s\n" "$REPO_TOKEN" >> .env

            docker pull "docker.io/$DOCKER_USERNAME/hits-attack-defense-platform:latest"
            docker compose down
            docker compose up -d --force-recreate
          EOF
